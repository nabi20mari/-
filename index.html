<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>틀린그림 탐험대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head>
<body>
<style>
/* Layout: a sunny "explorer's field kit" — full-screen app with a home shelf of photo cards,
   then a game board that fits two photos side by side (landscape) or stacked (portrait). */
:root {
  --sky: #DDF1FF;          /* page ground */
  --sky-deep: #B9E0FB;
  --ink: #1C2A4A;          /* text */
  --ink-soft: #55648A;
  --paper: #FFFFFF;        /* cards */
  --sun: #FFC633;          /* found rings, stars */
  --berry: #FF4F7B;        /* primary action */
  --berry-dark: #D93460;
  --leaf: #23B38A;         /* success */
  --miss: #F0453A;         /* wrong tap */
  --shadow: 0 6px 0 rgba(28, 42, 74, .14);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--font-body); font-size: 16px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, label:focus-visible, .card:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

.screen { position: fixed; inset: 0; display: flex; flex-direction: column; }
.screen[hidden] { display: none !important; }

/* ---------- Home ---------- */
#home { overflow-y: auto; -webkit-overflow-scrolling: touch; background: linear-gradient(180deg, #CBE9FF 0, var(--sky) 320px); }
.home-in {
  width: 100%; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
  display: flex; flex-direction: column; gap: 26px;
}
.brand { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand-mark { width: 84px; height: 84px; flex: none; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(38px, 6vw, 64px); line-height: 1; letter-spacing: -.01em;
  text-wrap: balance;
}
.brand h1 span { color: var(--berry); }
.brand p { margin: 6px 0 0; color: var(--ink-soft); font-size: 18px; }

.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 28px; }

.levels { display: flex; gap: 8px; background: var(--paper); padding: 6px; border-radius: 999px; box-shadow: var(--shadow); }
.levels button {
  font-family: var(--font-display); font-size: 19px; padding: 10px 18px; border-radius: 999px;
  color: var(--ink-soft); display: flex; align-items: center; gap: 6px;
}
.levels button small { font-family: var(--font-body); font-size: 13px; opacity: .8; }
.levels button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  position: relative; background: var(--paper); border-radius: 22px; padding: 10px 10px 12px;
  box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 10px;
  transition: transform .15s ease;
}
.card:active { transform: translateY(3px) scale(.985); }
.card .ph { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--sky-deep); position: relative; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.card .name { font-family: var(--font-display); font-size: 21px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .stars { font-size: 18px; letter-spacing: 1px; color: #D8DEEA; flex: none; }
.card .stars b { color: var(--sun); font-weight: 400; }
.card .del {
  position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%;
  background: rgba(28,42,74,.72); color: #fff; font-size: 20px; line-height: 36px; text-align: center;
}
.card.add {
  border: 3px dashed #8FBCE6; background: rgba(255,255,255,.6); box-shadow: none;
  align-items: center; justify-content: center; min-height: 220px; text-align: center; cursor: pointer;
}
.card.add .plus { width: 70px; height: 70px; border-radius: 50%; background: var(--berry); color: #fff;
  font-size: 46px; line-height: 70px; font-family: var(--font-display); box-shadow: 0 5px 0 var(--berry-dark); }
.card.add .name { white-space: normal; }
.card.add p { margin: 0; color: var(--ink-soft); font-size: 15px; }
#fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.how div { background: rgba(255,255,255,.7); border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 1.45; }
.how i { font-style: normal; font-size: 30px; flex: none; }
.foot { color: var(--ink-soft); font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.foot button { text-decoration: underline; color: var(--ink-soft); }

/* ---------- Game ---------- */
#game { background: #10213F; color: #fff; }
.bar {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.bar .spacer { flex: 1; min-width: 0; }
.pill {
  height: 52px; min-width: 52px; border-radius: 26px; background: rgba(255,255,255,.12);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
  font-family: var(--font-display); font-size: 21px; color: #fff; flex: none;
}
button.pill:active { background: rgba(255,255,255,.24); }
.pill svg { width: 26px; height: 26px; }
.pill.hint { background: var(--sun); color: var(--ink); box-shadow: 0 4px 0 #C99512; }
.pill.hint:disabled { background: rgba(255,255,255,.12); color: rgba(255,255,255,.4); box-shadow: none; }
.pill.hint .cnt { background: var(--ink); color: var(--sun); border-radius: 12px; font-size: 16px; min-width: 24px; height: 24px; line-height: 24px; text-align: center; }
.pill.hint:disabled .cnt { background: rgba(255,255,255,.15); color: rgba(255,255,255,.5); }
.dots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); transition: all .3s; }
.dot.on { background: var(--sun); border-color: var(--sun); transform: scale(1.15); box-shadow: 0 0 12px rgba(255,198,51,.8); }
.timer { font-variant-numeric: tabular-nums; }
.found-txt { font-family: var(--font-display); font-size: 21px; white-space: nowrap; }
.found-txt b { color: var(--sun); font-weight: 400; }

.board { flex: 1; min-height: 0; position: relative;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 4px 12px;
}
.panes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; }
.panes.stack { flex-direction: column; }
.pane {
  position: relative; overflow: hidden; border-radius: 14px; background: #000; flex: none;
  touch-action: none; box-shadow: 0 0 0 3px rgba(255,255,255,.14);
}
.pane .tag {
  position: absolute; left: 10px; top: 10px; z-index: 3; pointer-events: none;
  font-family: var(--font-display); font-size: 15px; padding: 4px 10px; border-radius: 10px;
  background: rgba(16,33,63,.72); color: #fff;
}
.stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
.stage canvas { width: 100%; height: 100%; display: block; }
.marks { position: absolute; inset: 0; pointer-events: none; }
.ring {
  position: absolute; border-radius: 50%;
  border: calc(5px / var(--z, 1)) solid var(--sun);
  box-shadow: 0 0 0 calc(2px / var(--z, 1)) rgba(16,33,63,.55), inset 0 0 0 calc(2px / var(--z, 1)) rgba(16,33,63,.35);
  animation: pop .5s cubic-bezier(.2,1.6,.4,1) both;
}
.ring.reveal { border-color: #fff; border-style: dashed; }
.ring .num {
  position: absolute; right: -6%; top: -6%; width: calc(28px / var(--z,1)); height: calc(28px / var(--z,1));
  border-radius: 50%; background: var(--sun); color: var(--ink);
  font-family: var(--font-display); font-size: calc(17px / var(--z,1)); line-height: calc(28px / var(--z,1)); text-align: center;
}
.ring.reveal .num { background: #fff; }
@keyframes pop { 0% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.miss {
  position: absolute; width: calc(56px / var(--z,1)); height: calc(56px / var(--z,1)); margin: calc(-28px / var(--z,1)) 0 0 calc(-28px / var(--z,1));
  animation: missfade .9s ease-out forwards;
}
.miss svg { width: 100%; height: 100%; }
@keyframes missfade { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.glow {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(255,230,120,.0) 35%, rgba(255,230,120,.55) 60%, rgba(255,230,120,0) 72%);
  animation: glow 1s ease-in-out 3;
}
@keyframes glow { 0%,100% { transform: scale(.85); opacity: .2; } 50% { transform: scale(1.1); opacity: 1; } }
.pane.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

.zoom-reset { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 22px; z-index: 5; }
.loading {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 24px; color: #fff; background: #10213F; z-index: 6;
}
.loading .mag { width: 90px; height: 90px; animation: sweep 1.4s ease-in-out infinite; }
@keyframes sweep { 0%,100% { transform: translate(-30px, 0) rotate(-8deg); } 50% { transform: translate(30px, -8px) rotate(8deg); } }

/* ---------- Overlay dialogs ---------- */
.veil {
  position: fixed; inset: 0; z-index: 20; background: rgba(10,22,44,.62);
  display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity: 0; } }
.sheet {
  background: var(--paper); color: var(--ink); border-radius: 30px; width: 100%; max-width: 520px;
  padding: 30px 26px 26px; text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 16px; align-items: center;
  animation: rise .45s cubic-bezier(.2,1.4,.4,1);
  max-height: 100%; overflow-y: auto;
}
@keyframes rise { from { transform: translateY(40px) scale(.9); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1.1; text-wrap: balance; }
.sheet p { margin: 0; color: var(--ink-soft); font-size: 17px; line-height: 1.5; }
.big-stars { display: flex; gap: 10px; }
.big-stars svg { width: 76px; height: 76px; }
.big-stars svg:nth-child(2) { transform: translateY(-14px); }
.big-stars .s { animation: starin .6s cubic-bezier(.2,1.8,.4,1) both; }
.big-stars .s:nth-child(2) { animation-delay: .25s; }
.big-stars .s:nth-child(3) { animation-delay: .5s; }
@keyframes starin { from { transform: scale(0) rotate(-90deg); } }
.stats { display: flex; gap: 10px; width: 100%; }
.stats div { flex: 1; background: var(--sky); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 14px; color: var(--ink-soft); }
.btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.btn {
  font-family: var(--font-display); font-size: 23px; padding: 15px 20px; border-radius: 20px; width: 100%;
  background: var(--sky); color: var(--ink); box-shadow: 0 5px 0 var(--sky-deep);
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sky-deep); }
.btn.primary { background: var(--berry); color: #fff; box-shadow: 0 5px 0 var(--berry-dark); }
.btn.primary:active { box-shadow: 0 2px 0 var(--berry-dark); }
.credits { text-align: left; font-size: 14px; color: var(--ink-soft); line-height: 1.5; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.credits div { overflow-wrap: anywhere; }
.credits b { color: var(--ink); font-weight: 400; font-family: var(--font-display); font-size: 16px; }
.credits a { color: var(--ink-soft); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

.toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 16px; z-index: 40; font-size: 17px;
  max-width: calc(100% - 32px); text-align: center; animation: fadein .2s;
}

@media (max-width: 640px) {
  .pill { height: 44px; min-width: 44px; padding: 0 12px; font-size: 18px; }
  .dot { width: 16px; height: 16px; border-width: 2px; }
  .hide-sm { display: none !important; }
  .levels button { padding: 8px 12px; font-size: 17px; }
  .levels button small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<!-- ================= HOME ================= -->
<section id="home" class="screen">
  <div class="home-in">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="42" cy="42" r="30" fill="#fff" stroke="#1C2A4A" stroke-width="8"/>
        <circle cx="42" cy="42" r="20" fill="#B9E0FB"/>
        <path d="M30 34a14 14 0 0 1 14-10" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
        <path d="M64 64l22 22" stroke="#1C2A4A" stroke-width="13" stroke-linecap="round"/>
        <path d="M64 64l22 22" stroke="#FF4F7B" stroke-width="7" stroke-linecap="round"/>
        <path d="M80 12l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#FFC633"/>
      </svg>
      <div>
        <h1>틀린그림 <span>탐험대</span></h1>
        <p>두 사진에서 달라진 곳을 콕! 눌러 찾아보세요.</p>
      </div>
    </header>

    <div class="row-head">
      <h2>사진을 골라요</h2>
      <div class="levels" role="group" aria-label="난이도">
        <button id="lv-easy" data-lv="easy">쉬움 <small>5곳</small></button>
        <button id="lv-normal" data-lv="normal">보통 <small>7곳</small></button>
        <button id="lv-hard" data-lv="hard">어려움 <small>10곳</small></button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="how">
      <div><i>👆</i><span>다른 곳을 찾으면 <b>왼쪽이든 오른쪽이든</b> 눌러요.</span></div>
      <div><i>🤏</i><span>두 손가락으로 벌리면 <b>두 사진이 같이</b> 커져요.</span></div>
      <div><i>💡</i><span>어려우면 <b>힌트</b>를 눌러요. 한 판에 3번 (어려움은 2번)!</span></div>
      <div><i>📷</i><span><b>내 사진</b>을 넣으면 새 문제가 자동으로 만들어져요.</span></div>
    </div>

    <div class="foot">
      <span>사진은 위키미디어 공용의 자유 이용 사진이에요.</span>
      <button id="creditsBtn">사진 출처 보기</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*">
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen" hidden>
  <div class="bar">
    <button class="pill" id="backBtn" aria-label="처음으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="pill timer hide-sm" id="timer" aria-label="걸린 시간">0:00</div>
    <div class="spacer"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="found-txt" id="foundTxt"><b>0</b> / 5</div>
    <div class="spacer"></div>
    <button class="pill" id="soundBtn" aria-label="소리 켜기/끄기"></button>
    <button class="pill hint" id="hintBtn">💡 힌트 <span class="cnt" id="hintCnt">3</span></button>
  </div>
  <div class="board" id="board">
    <div class="panes" id="panes">
      <div class="pane" id="paneA"><span class="tag">원래 사진</span><div class="stage"><canvas id="cvA"></canvas><div class="marks"></div></div></div>
      <div class="pane" id="paneB"><span class="tag">달라진 사진</span><div class="stage"><canvas id="cvB"></canvas><div class="marks"></div></div></div>
    </div>
    <button class="pill zoom-reset" id="zoomReset" hidden>🔍 원래 크기</button>
    <div class="loading" id="loading">
      <svg class="mag" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="42" cy="42" r="28" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="8"/>
        <path d="M63 63l22 22" stroke="#FF4F7B" stroke-width="11" stroke-linecap="round"/>
      </svg>
      <span id="loadingTxt">틀린 곳을 숨기는 중…</span>
    </div>
  </div>
</section>

<canvas id="confetti"></canvas>

    const lum = (g) => .299 * cR[g] + .587 * cG[g] + .114 * cB[g];

    for (let i = 0; i < w * h; i++) {

      const e = Math.abs(lum(g + 1) - lum(g - 1)) + Math.abs(lum(g + W) - lum(g - W));

  }
  // solve  Δf = Δg  inside mask, f = current image on the border (seamless clone)
  function poisson(mask, x0, y0, w, h, dx, dy) {

  /* ---- paste an object (from the original) with a transform, following its outline ---- */
  function pasteSeg(sg, tx, ty, mode, scale) {

      for (let c = 0; c < 3; c++) {
        const Gc = O[c];
        const v = (Gc[g00] * (1 - fx) + Gc[g00 + 1] * fx) * (1 - fy) + (Gc[g00 + W] * (1 - fx) + Gc[g00 + W + 1] * fx) * fy;

  }

  /* ---- recolour along the outline ---- */
  function recolor(sg) {
    const { x0, y0, w, h } = sg, a = soften(dilate(sg.m, w, h, 1), w, h);
    let sat = 0, n = 0;
    for (let i = 0; i < w * h; i++) if (sg.m[i]) { const g = (((i / w) | 0) + y0) * W + (i % w) + x0; const hv = rgb2hsv(oR[g], oG[g], oB[g]); sat += hv[1]; n++; }
    sat /= n || 1;
    let hx = 0, hy = 0;
    for (let i = 0; i < w * h; i += 2) if (sg.m[i]) { const g = (((i / w) | 0) + y0) * W + (i % w) + x0; const hv = rgb2hsv(oR[g], oG[g], oB[g]); hx += Math.cos(hv[0] * Math.PI / 180) * hv[1]; hy += Math.sin(hv[0] * Math.PI / 180) * hv[1]; }
    const mh = (Math.atan2(hy, hx) * 180 / Math.PI + 360) % 360;
    if (mh > 8 && mh < 45 && sat > .18 && sat < .6) return false;   // looks like skin: faces turning blue is silly, not tricky
    // borrow a colour that already exists in this photo, so the new colour belongs there
    const n2 = Math.max(1, n);
    let mL = 0, mA = 0, mB = 0, cnt = 0;
    for (let i = 0; i < w * h; i++) if (sg.m[i]) { const g = (((i / w) | 0) + y0) * W + (i % w) + x0; mL += LL[g]; mA += LA[g]; mB += LB[g]; cnt++; }
    mL /= cnt; mA /= cnt; mB /= cnt;
    if (mL < 26) return false;                       // black things (pupils, tyres) look fake in colour
    const chroma = Math.hypot(mA, mB);
    const opts = palette.filter(p => { const d = Math.hypot(p[1] - mA, p[2] - mB); return d >= L.dE[0] && d <= L.dE[1] && Math.abs(p[0] - mL) < 40 && Math.hypot(p[1], p[2]) >= Math.min(25, chroma * .6); });
    if (!opts.length) return false;
    const t = opts[(R() * opts.length) | 0];
    const dL = (t[0] - mL) * .85, dA = t[1] - mA, dB = t[2] - mB;
    for (let i = 0; i < w * h; i++) {
      const al = a[i]; if (!al) continue;
      const g = (((i / w) | 0) + y0) * W + (i % w) + x0;
      const lab = rgb2lab(C[0][g], C[1][g], C[2][g]);
      // keep the object's own shading; move only its colour (and a little of its brightness)
      const rgb = lab2rgb(lab[0] + dL, lab[1] + dA, lab[2] + dB);

  function rgb2lab(r, g, b) {
    const R_ = fl(r), G_ = fl(g), B_ = fl(b);
    const X = (.4124 * R_ + .3576 * G_ + .1805 * B_) / .9505, Y = .2126 * R_ + .7152 * G_ + .0722 * B_, Z = (.0193 * R_ + .1192 * G_ + .9505 * B_) / 1.089;
    const f = (t) => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;

  }
  function lab2rgb(l, a, b) {
    const fy = (l + 16) / 116, fx = fy + a / 500, fz = fy - b / 200;
    const fi = (t) => t > .206893 ? t * t * t : (t - 16 / 116) / 7.787;
    const X = fi(fx) * .9505, Y = fi(fy), Z = fi(fz) * 1.089;

    const gam = (v) => { v = Math.max(0, Math.min(1, v)); return 255 * (v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055); };

    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }

  /* ---- how visible is a change? ---- */
  function measure(x0, y0, x1, y1) {

    let n = 0, sum = 0, mnx = W, mny = H, mxx = 0, mxy = 0;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const g = y * W + x, d = (Math.abs(cR[g] - oR[g]) + Math.abs(cG[g] - oG[g]) + Math.abs(cB[g] - oB[g])) / 3;
      if (d > 20) { n++; sum += d; if (x < mnx) mnx = x; if (x > mxx) mxx = x; if (y < mny) mny = y; if (y > mxy) mxy = y; }

  const diffs = [];
  const gap = B * .035;

    const sg = segment(c.x, c.y);

    } else if (type === "remove") {

      else { const s = .62; pasteSeg(sg, sg.cx, sg.cy + (sg.by1 - sg.cy) * (1 - s), "copy", s); }
      region = sg;
    } else if (type === "add") {

      const bw = sg.bx1 - sg.bx0 + 1, bh = sg.by1 - sg.by0 + 1;

        if (!free(box)) continue;
        if (Math.abs(px - ctrX) < bw * 1.4 && Math.abs(py - ctrY) < bh * 1.4) continue;

          s += Math.abs(oR[gs] - cR[gt]) + Math.abs(oG[gs] - cG[gt]) + Math.abs(oB[gs] - cB[gt]);
        }
        for (let yy = -2; yy <= 2; yy++) for (let xx = -2; xx <= 2; xx++) ge += grad[Math.round(py + yy * bh / 5) * W + Math.round(px + xx * bw / 5)] || 0;
        const sc = s / 72 + ge / 25 * .6;

      }
      if (!best || bestS > 40) continue;
      const tx = best.px + (sg.cx - ctrX), ty = best.py + (sg.cy - ctrY);

    }
    const m = measure(region.bx0 - 4, region.by0 - 4, region.bx1 + 4, region.by1 + 4);
    if (m.n < minPix || m.mean < thr * (type === "recolor" ? .7 : 1) || !free(m)) { undo(); continue; }
    const rx = Math.max((m.bx1 - m.bx0) / 2 + 3, rMin), ry = Math.max((m.by1 - m.by0) / 2 + 3, rMin);
    diffs.push({ x: (m.bx0 + m.bx1) / 2, y: (m.by0 + m.by1) / 2, rx, ry, bx0: m.bx0, by0: m.by0, bx1: m.bx1, by1: m.by1, type, found: false });

  const out = new Uint8ClampedArray(N * 4);
  for (let i = 0, p = 0; i < N; i++, p += 4) { out[p] = cR[i]; out[p + 1] = cG[i]; out[p + 2] = cB[i]; out[p + 3] = 255; }
  return { W, H, original: src, changed: new ImageData(out, W, H), diffs };
}

const st = {

/* ================= Home ================= */
function starsHTML(n) { let s = ""; for (let i = 0; i < 3; i++) s += i < n ? "<b>★</b>" : "★"; return s; }
function bestKey(id) { return "best:" + id + ":" + level; }

function renderHome() {
  document.querySelectorAll(".levels button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lv === level));
  const g = $("#grid"); g.innerHTML = "";
  const add = document.createElement("label");
  add.className = "card add"; add.htmlFor = "fileInput"; add.tabIndex = 0;
  add.innerHTML = `<div class="plus">+</div><div class="name">내 사진으로 만들기</div><p>찍은 사진이나 앨범 사진을 넣으면<br>틀린 곳이 자동으로 생겨요.</p>`;
  add.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("#fileInput").click(); } });
  g.appendChild(add);
  const all = [...myPhotos.map(p => ({ ...p, mine: true })), ...PHOTOS];
  for (const p of all) {
    const b = document.createElement("button"); b.className = "card"; b.id = "card-" + p.id;
    const best = store.get(bestKey(p.id), 0);
    b.innerHTML = `<div class="ph"><img alt="" loading="lazy" src="${p.thumb || p.src}"></div>
      <div class="meta"><span class="name"></span><span class="stars" aria-label="최고 별 ${best}개">${starsHTML(best)}</span></div>`;
    b.querySelector(".name").textContent = p.name;
    b.addEventListener("click", () => { sound.ensure(); sound.play("tap"); startGame(p); });
    if (p.mine) {
      const d = document.createElement("span"); d.className = "del"; d.textContent = "×"; d.setAttribute("role", "button"); d.setAttribute("aria-label", "이 사진 지우기");
      d.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (d.dataset.armed) { myPhotos = myPhotos.filter(x => x.id !== p.id); await idb.del(p.id); renderHome(); toast("사진을 지웠어요."); }
        else { d.dataset.armed = "1"; d.textContent = "지울까요?"; d.style.width = "auto"; d.style.padding = "0 12px"; d.style.borderRadius = "18px"; d.style.fontSize = "15px"; d.style.background = "var(--miss)";
          setTimeout(() => { if (d.isConnected) { delete d.dataset.armed; d.textContent = "×"; d.removeAttribute("style"); } }, 2500); }
      });
      b.querySelector(".ph").appendChild(d);
    }
    g.appendChild(b);
  }
}

document.querySelectorAll(".levels button").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.lv; store.set("level", level); sound.ensure(); sound.play("tap"); renderHome();

$("#fileInput").addEventListener("change", async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const url = URL.createObjectURL(f);
    const im = await loadImage(url);
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const src = c.toDataURL("image/jpeg", .9);
    const t = document.createElement("canvas"); const tk = 480 / Math.max(c.width, c.height);
    t.width = Math.round(c.width * tk); t.height = Math.round(c.height * tk); t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
    const n = myPhotos.length + 1;
    const p = { id: "my" + Date.now(), name: "우리 사진 " + n, src, thumb: t.toDataURL("image/jpeg", .8), added: Date.now() };
    myPhotos.unshift(p); await idb.put(p); renderHome();
    startGame({ ...p, mine: true });
  } catch (err) { toast("이 사진은 열 수 없어요. 다른 사진을 골라 주세요."); }
});

/* ================= Game ================= */
const paneA = $("#paneA"), paneB = $("#paneB"), cvA = $("#cvA"), cvB = $("#cvB");
let wakeLock = null;

async function startGame(p, sameSeed) {
  st.photo = p; st.done = false; st.misses = 0; st.hintsUsed = 0; st.hintsLeft = LEVELS[level].hints;

  $("#home").hidden = true; $("#game").hidden = false; $("#loading").hidden = false;
  $("#loadingTxt").textContent = "틀린 곳을 숨기는 중…";
  clearMarks(); resetView(); stopTimer(); $("#timer").textContent = "0:00";
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  let img;
  try { img = await loadImage(p.src); }
  catch (e) { $("#loadingTxt").textContent = "사진을 불러오지 못했어요. 뒤로 가서 다시 골라 주세요."; return; }
  await new Promise(r => setTimeout(r, 30));   // let the loading screen paint
  const pz = buildPuzzle(img, level, st.seed);
  st.puzzle = pz;
  for (const [cv, data] of [[cvA, pz.original], [cvB, pz.changed]]) { cv.width = pz.W; cv.height = pz.H; cv.getContext("2d").putImageData(data, 0, 0); }
  // Randomly swap which side is "original" only in label terms? Keep A original for clarity.
  buildDots(); updateHud(); layout();
  $("#loading").hidden = true;
  st.startT = performance.now(); st.elapsed = 0; startTimer();
}

function buildDots() {
  const d = $("#dots"); d.innerHTML = "";
  const n = st.puzzle.diffs.length;
  d.classList.toggle("hide-sm", n > 7);
  for (let i = 0; i < n; i++) { const s = document.createElement("span"); s.className = "dot"; d.appendChild(s); }
}
function updateHud() {
  const pz = st.puzzle, f = pz.diffs.filter(d => d.found).length;
  $("#foundTxt").innerHTML = `<b>${f}</b> / ${pz.diffs.length}`;
  [...$("#dots").children].forEach((el, i) => el.classList.toggle("on", i < f));
  $("#hintCnt").textContent = st.hintsLeft;
  $("#hintBtn").disabled = st.hintsLeft <= 0 || st.done;
  $("#soundBtn").textContent = sound.on ? "🔊" : "🔈";
}
function fmt(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function startTimer() { stopTimer(); st.timerId = setInterval(() => { if (!document.hidden) $("#timer").textContent = fmt(performance.now() - st.startT); }, 250); }
function stopTimer() { clearInterval(st.timerId); }

function layout() {
  const pz = st.puzzle; if (!pz) return;
  const board = $("#board"), cs = getComputedStyle(board);
  const w = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = board.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gap = 12;
  const sSide = Math.min((w - gap) / 2 / pz.W, h / pz.H);
  const sStack = Math.min(w / pz.W, (h - gap) / 2 / pz.H);
  const stack = sStack > sSide;
  const s = Math.max(.01, stack ? sStack : sSide);
  const pw = Math.floor(pz.W * s), ph = Math.floor(pz.H * s);
  const panes = $("#panes");
  panes.classList.toggle("stack", stack);
  panes.style.left = cs.paddingLeft; panes.style.right = cs.paddingRight;
  panes.style.top = cs.paddingTop; panes.style.bottom = cs.paddingBottom;
  for (const p of [paneA, paneB]) { p.style.width = pw + "px"; p.style.height = ph + "px"; }
  st.layout = { pw, ph };
  clampView(); applyView();
}
window.addEventListener("resize", () => { if (!$("#game").hidden) layout(); });

/* ---- synced zoom & pan ---- */
function resetView() { st.view = { z: 1, tx: 0, ty: 0 }; applyView(); }
function clampView() {
  const v = st.view, L = st.layout; if (!L) return;
  v.z = Math.max(1, Math.min(4, v.z));
  v.tx = Math.min(0, Math.max(L.pw - L.pw * v.z, v.tx));
  v.ty = Math.min(0, Math.max(L.ph - L.ph * v.z, v.ty));
}
function applyView() {
  const v = st.view;
  for (const p of [paneA, paneB]) {
    const s = p.querySelector(".stage");
    s.style.transform = `translate(${v.tx}px, ${v.ty}px) scale(${v.z})`;
    s.style.setProperty("--z", v.z);
  }
  $("#zoomReset").hidden = v.z <= 1.01;
}
$("#zoomReset").addEventListener("click", () => { resetView(); });

const pointers = new Map();
let gesture = null;
function onDown(e) {
  const pane = e.currentTarget;
  pane.setPointerCapture && pane.setPointerCapture(e.pointerId);
  const r = pane.getBoundingClientRect();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, pane, r });
  if (pointers.size === 1) gesture = { type: "tap", sx: e.clientX, sy: e.clientY, t: performance.now(), v0: { ...st.view }, pane, r };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, v0: { ...st.view }, r: a.r };
  }
}
function onMove(e) {
  const p = pointers.get(e.pointerId); if (!p || !gesture) return;
  p.x = e.clientX; p.y = e.clientY;
  if (gesture.type === "tap" || gesture.type === "pan") {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (gesture.type === "tap" && Math.hypot(dx, dy) > 12) gesture.type = "pan";
    if (gesture.type === "pan" && st.view.z > 1) {
      st.view.tx = gesture.v0.tx + dx; st.view.ty = gesture.v0.ty + dy; clampView(); applyView();
    }
  } else if (gesture.type === "pinch" && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const v0 = gesture.v0, z = Math.max(1, Math.min(4, v0.z * d / gesture.d0));
    // keep the point under the fingers fixed
    const lx = gesture.mx - gesture.r.left, ly = gesture.my - gesture.r.top;
    const ix = (lx - v0.tx) / v0.z, iy = (ly - v0.ty) / v0.z;
    st.view.z = z;
    st.view.tx = (mx - gesture.r.left) - ix * z; st.view.ty = (my - gesture.r.top) - iy * z;
    clampView(); applyView();
  }
}
function onUp(e) {
  const p = pointers.get(e.pointerId); pointers.delete(e.pointerId);
  if (!gesture) return;
  if (gesture.type === "tap" && pointers.size === 0 && e.type === "pointerup" && performance.now() - gesture.t < 700) {
    handleTap(gesture.pane, e.clientX, e.clientY);
  }
  if (pointers.size === 0) gesture = null;
  else if (gesture.type === "pinch") gesture = { type: "done" };
}
for (const p of [paneA, paneB]) {
  p.addEventListener("pointerdown", onDown);
  p.addEventListener("pointermove", onMove);
  p.addEventListener("pointerup", onUp);
  p.addEventListener("pointercancel", onUp);
  p.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = p.getBoundingClientRect(), v = st.view;
    const lx = e.clientX - r.left, ly = e.clientY - r.top, ix = (lx - v.tx) / v.z, iy = (ly - v.ty) / v.z;
    v.z = Math.max(1, Math.min(4, v.z * Math.exp(-e.deltaY * .0025)));
    v.tx = lx - ix * v.z; v.ty = ly - iy * v.z; clampView(); applyView();
  }, { passive: false });
  p.addEventListener("contextmenu", e => e.preventDefault());
}
// stop iOS Safari page zoom gestures
document.addEventListener("gesturestart", e => e.preventDefault());

function toImage(pane, clientX, clientY) {
  const r = pane.getBoundingClientRect(), v = st.view, L = st.layout;
  const lx = (clientX - r.left - v.tx) / v.z, ly = (clientY - r.top - v.ty) / v.z;
  return { x: lx / L.pw * st.puzzle.W, y: ly / L.ph * st.puzzle.H, k: st.puzzle.W / L.pw / v.z };
}

let missBurst = [];
function handleTap(pane, cx, cy) {
  if (st.done || !st.puzzle) return;
  sound.ensure();
  const { x, y, k } = toImage(pane, cx, cy);
  const pz = st.puzzle;
  const touchSlack = 22 * k;          // fingers are bigger than the mark
  let hit = null, best = Infinity;
  for (const d of pz.diffs) {
    if (d.found) continue;
    const dx = (x - d.x) / (d.rx * 1.1 + touchSlack), dy = (y - d.y) / (d.ry * 1.1 + touchSlack);
    const dist = dx * dx + dy * dy;
    if (dist <= 1 && dist < best) { best = dist; hit = d; }
  }
  if (hit) {
    hit.found = true;
    const idx = pz.diffs.filter(d => d.found).length;
    drawRing(hit, idx, false);
    sound.play("found");
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
    updateHud();
    if (pz.diffs.every(d => d.found)) win();
  } else {
    // already found spot? ignore quietly
    if (pz.diffs.some(d => d.found && Math.hypot((x - d.x) / d.rx, (y - d.y) / d.ry) < 1.3)) return;
    st.misses++;
    drawMiss(x, y);
    sound.play("miss");
    pane.classList.remove("shake"); void pane.offsetWidth; pane.classList.add("shake");
    const now = performance.now();
    missBurst = missBurst.filter(t => now - t < 3000); missBurst.push(now);
    if (missBurst.length >= 4) { missBurst = []; toast("천천히 두 사진을 비교해 봐요 🔎"); }
  }
}

function clearMarks() { document.querySelectorAll(".marks").forEach(m => m.innerHTML = ""); }
function pct(v, total) { return (v / total * 100) + "%"; }
function drawRing(d, idx, reveal) {
  const pz = st.puzzle, pad = 1.18;
  for (const pane of [paneA, paneB]) {
    const el = document.createElement("div"); el.className = "ring" + (reveal ? " reveal" : "");
    el.style.left = pct(d.x - d.rx * pad, pz.W); el.style.top = pct(d.y - d.ry * pad, pz.H);
    el.style.width = pct(d.rx * 2 * pad, pz.W); el.style.height = pct(d.ry * 2 * pad, pz.H);
    el.innerHTML = `<span class="num">${idx}</span>`;
    pane.querySelector(".marks").appendChild(el);
  }
}
function drawMiss(x, y) {
  const pz = st.puzzle;
  for (const pane of [paneA, paneB]) {
    const el = document.createElement("div"); el.className = "miss";
    el.style.left = pct(x, pz.W); el.style.top = pct(y, pz.H);
    el.innerHTML = `<svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="rgba(240,69,58,.25)" stroke="#fff" stroke-width="4"/><path d="M19 19l18 18M37 19L19 37" stroke="#F0453A" stroke-width="7" stroke-linecap="round"/><path d="M19 19l18 18M37 19L19 37" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/></svg>`;
    pane.querySelector(".marks").appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}

$("#hintBtn").addEventListener("click", () => {
  if (st.done || st.hintsLeft <= 0) return;
  const left = st.puzzle.diffs.filter(d => !d.found);
  if (!left.length) return;
  const d = left[(Math.random() * left.length) | 0];
  st.hintsLeft--; st.hintsUsed++;
  sound.play("hint");
  const pz = st.puzzle;
  // a soft glow near (not exactly on) the spot, so finding it is still her job
  const R2 = Math.max(d.rx, d.ry) * 2.6;
  const ox = d.x + (Math.random() - .5) * d.rx * .9, oy = d.y + (Math.random() - .5) * d.ry * .9;
  for (const pane of [paneA, paneB]) {
    const el = document.createElement("div"); el.className = "glow";
    el.style.left = pct(ox - R2, pz.W); el.style.top = pct(oy - R2, pz.H);
    el.style.width = pct(R2 * 2, pz.W); el.style.height = pct(R2 * 2, pz.H);
    pane.querySelector(".marks").appendChild(el);
    setTimeout(() => el.remove(), 3100);
  }
  updateHud();
});

$("#soundBtn").addEventListener("click", () => { sound.on = !sound.on; store.set("sound", sound.on); sound.ensure(); if (sound.on) sound.play("tap"); updateHud(); });
$("#backBtn").addEventListener("click", goHome);
function goHome() {
  stopTimer(); st.done = true; closeVeil();
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  $("#game").hidden = true; $("#home").hidden = false; renderHome();
}

/* ---- win ---- */
function calcStars() {
  if (st.hintsUsed === 0 && st.misses <= 2) return 3;
  if (st.hintsUsed <= 1 && st.misses <= 6) return 2;
  return 1;
}
const CHEERS = ["대단해요!", "눈이 정말 좋아요!", "최고의 탐험가!", "모두 찾았어요!", "와, 완벽해요!"];
function starSVG(on) {
  return `<svg class="s" viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z" fill="${on ? "#FFC633" : "#E3E8F2"}" stroke="${on ? "#D99A00" : "#C9D1E0"}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}
function win() {
  st.done = true; stopTimer();
  const ms = performance.now() - st.startT, stars = calcStars();
  const key = bestKey(st.photo.id); if (stars > store.get(key, 0)) store.set(key, stars);
  updateHud();
  setTimeout(() => {
    sound.play("win"); confetti();
    const all = [...myPhotos.map(p => ({ ...p, mine: true })), ...PHOTOS];
    const i = all.findIndex(p => p.id === st.photo.id), next = all[(i + 1) % all.length];
    showVeil(`
      <div class="big-stars">${starSVG(stars >= 1)}${starSVG(stars >= 2)}${starSVG(stars >= 3)}</div>
      <h2>${CHEERS[(Math.random() * CHEERS.length) | 0]}</h2>
      <div class="stats">
        <div><b>${fmt(ms)}</b><span>걸린 시간</span></div>
        <div><b>${st.misses}</b><span>헛짚은 곳</span></div>
        <div><b>${st.hintsUsed}</b><span>쓴 힌트</span></div>
      </div>
      <div class="btns">
        <button class="btn primary" id="nextBtn">다음 사진 ▶</button>
        <button class="btn" id="againBtn">같은 사진, 새 틀린 곳</button>
        <button class="btn" id="homeBtn">처음으로</button>
      </div>`);
    $("#nextBtn").onclick = () => { closeVeil(); startGame(next); };
    $("#againBtn").onclick = () => { closeVeil(); startGame(st.photo); };
    $("#homeBtn").onclick = goHome;
  }, 650);
}

function showVeil(html) {
  closeVeil();
  const v = document.createElement("div"); v.className = "veil"; v.id = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(v);
  return v;
}
function closeVeil() { const v = $("#veil"); if (v) v.remove(); }

$("#creditsBtn").addEventListener("click", () => {
  const rows = PHOTOS.map(p => `<div><b>${esc(p.name)}</b><br>${esc(p.credit)} · ${esc(p.license)}<br><a href="${p.page}" target="_blank" rel="noopener">${esc(p.page.replace("https://", ""))}</a></div>`).join("");
  showVeil(`<h2>사진 출처</h2><p>위키미디어 공용(Wikimedia Commons)의 자유 이용 사진입니다. 게임을 위해 크기를 줄이고 틀린 곳을 만들어 변형했어요.</p><div class="credits">${rows}</div><div class="btns"><button class="btn primary" id="closeCr">닫기</button></div>`);
  $("#closeCr").onclick = closeVeil;
  $("#veil").addEventListener("click", e => { if (e.target.id === "veil") closeVeil(); });
});
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let toastT = 0;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* ---- confetti ---- */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const colors = ["#FFC633", "#FF4F7B", "#23B38A", "#4AA8F0", "#FFFFFF", "#FF9A3C"];
  const parts = Array.from({ length: 170 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .45,
    vx: (Math.random() - .5) * 17, vy: -Math.random() * 17 - 5, r: 5 + Math.random() * 7,
    a: Math.random() * 6, va: (Math.random() - .5) * .35, c: colors[(Math.random() * colors.length) | 0], sh: Math.random() < .3,
  }));
  const t0 = performance.now();
  (function step(t) {
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if (p.sh) { x.beginPath(); x.arc(0, 0, p.r / 2, 0, 7); x.fill(); } else x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      x.restore();
    }
    if (t - t0 < 3200) requestAnimationFrame(step); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && !$("#game").hidden && !st.done) { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
});

/* ---- boot ---- */
(async function boot() {
  renderHome();
  myPhotos = (await idb.all()).sort((a, b) => b.added - a.added);
  if (myPhotos.length) renderHome();
})();
</script>

</body>
